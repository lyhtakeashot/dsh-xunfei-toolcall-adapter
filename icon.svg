  <path d="M27.4 12.4 29.8 14.8 27.4 17.2" stroke="#2F9E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="27.6" cy="24.4" r="4.2" stroke="#2F9E63" stroke-width="2"/>
  <path d="M25.9 24.4l1.3 1.3 2.4-2.6" stroke="#2F9E63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>