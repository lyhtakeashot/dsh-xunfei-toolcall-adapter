<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 主体：一段对话气泡，右侧被「修正」为结构化的调用节点 -->
  <path d="M7 8.5C7 7.12 8.12 6 9.5 6h13c1.38 0 2.5 1.12 2.5 2.5v9c0 1.38-1.12 2.5-2.5 2.5H14.2L10 23.6v-3.6H9.5C8.12 20 7 18.88 7 17.5v-9Z" stroke="#4A7DBE" stroke-width="2" stroke-linejoin="round"/>
  <!-- 气泡内的「工具节点」：一个方框加连线，表示调用被结构化 -->
  <rect x="11" y="10" width="4.4" height="4.4" rx="1" fill="#4A7DBE"/>
  <rect x="18.6" y="10" width="4.4" height="4.4" rx="1" fill="#4A7DBE" opacity="0.45"/>
  <path d="M13.2 14.4v3.2h7.6v-3.2" stroke="#4A7DBE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
